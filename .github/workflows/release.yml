name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform values MUST match the package:<platform> script names in
          # package.json (mac/win, NOT macos/windows) — pinned by
          # tests/workflow.test.ts
          - os: macos-latest
            platform: mac
            targets: "darwin-arm64,darwin-x64"
          - os: ubuntu-latest
            platform: linux
            targets: "linux-arm64,linux-x64"
          - os: windows-latest
            platform: win
            targets: "windows-x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"
      - run: bun install
      # Native per-platform builds only: no cross-compile, no bun#25346 cache seeding needed.
      - run: bun run build:platform -- ${{ matrix.targets }}
      - run: bun run package:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/o2a2o-*
            dist/installers/*
            dist/checksums.txt
            dist/installers/checksums.txt
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without merge-multiple each artifact lands in its own directory:
      # artifacts/dist-<platform>/{o2a2o-*, checksums.txt, installers/*}.
      # (merge-multiple would collapse the three per-platform checksums.txt
      # files onto one path, silently losing two platforms' sums.)
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # One checksums.txt for the whole release: 5 binary lines + 9 installer
      # lines. The asset MUST be named checksums.txt — the o2a2o updater
      # hardcodes that name (src/update/github-releases.ts).
      - name: Merge checksums
        run: |
          cd artifacts
          cat dist-*/checksums.txt dist-*/installers/checksums.txt > checksums.txt
          # hard assertion: 5 binaries + 9 installers — a short count means a
          # platform artifact was partial or missing, fail before publishing
          [ "$(wc -l < checksums.txt)" -eq 14 ] || { echo "expected 14 checksum lines, got $(wc -l < checksums.txt)"; exit 1; }
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --prerelease \
            --title "${{ github.ref_name }} (Release Candidate)" \
            --notes "RC build for testing - not stable. Verify the assets against checksums.txt (sha256, one line per asset; run sha256sum -c from inside the download directory). The built-in o2a2o update command can consume this release when allow_prerelease is true under update in the config." \
            artifacts/dist-*/o2a2o-* artifacts/dist-*/installers/o2a2o_* artifacts/checksums.txt
